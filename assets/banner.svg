<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b12"/><stop offset="1" stop-color="#2b1020"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g filter="url(#b)" opacity=".5">
    <circle cx="220" cy="90" r="90" fill="#f43f5e"><animate attributeName="cx" values="220;440;220" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="220" r="110" fill="#f59e0b"><animate attributeName="cy" values="220;60;220" dur="11s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4s" repeatCount="indefinite"/>
      <text x="600" y="150" font-size="84" font-weight="800" fill="url(#ac)">promptguard</text>
    </g>
    <text x="600" y="205" font-size="26" fill="#e7d5d5">Catch prompt injection before it reaches your LLM</text>
  </g>
  <rect x="450" y="234" width="300" height="4" rx="2" fill="url(#ac)"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></rect>
</svg>
